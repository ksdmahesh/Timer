<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Timer - Responsive & Fullscreen Landscape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Normal / Stopped Mode: Clean Responsive Portrait Card */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      background: #000000;
      transition: all 0.3s ease;
    }

    /* Active / Running Mode: Fullscreen Stretch */
    body.running-mode .app-container {
      max-width: none;
      max-height: none;
      width: 100vw;
      height: 100vh;
      padding: 4vh 4vw;
    }

    /* CSS Fallback: Force Landscape Layout on Mobile in Portrait */
    @media screen and (orientation: portrait) {
      body.running-mode .app-container {
        transform: rotate(90deg);
        transform-origin: 50vh 50vh;
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 0;
        left: 0;
      }
    }

    /* Top Navigation / Log Header */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      z-index: 10;
    }

    .header-btn {
      width: auto; /* Fit to content size */
      padding: 10px 20px;
      font-size: 0.95rem;
      border: 1px solid #ffffff;
      background: #000000;
      color: #ffffff;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .header-btn svg {
      width: 1.1em;
      height: 1.1em;
      fill: currentColor;
    }

    .header-btn.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Timer Display */
    .timer-display {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      font-size: clamp(3.5rem, 15vw, 14vh);
      margin: auto 0;
    }

    /* Controls */
    .controls { 
      display: flex; 
      flex-direction: column;
      gap: 16px; 
      width: 100%;
      max-width: 280px;
      margin-bottom: 2vh;
      z-index: 10;
    }

    button {
      background: #000000;
      color: #ffffff;
      border: 2px solid #ffffff;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      font-size: 1.2rem;
      width: 100%;
      transition: background-color 0.15s, opacity 0.4s ease, border-color 0.2s;
    }

    button svg {
      width: 1.2em;
      height: 1.2em;
      fill: currentColor;
    }

    button:active:not(:disabled) {
      background-color: #ffffff;
      color: #000000;
    }

    /* Auto-Hide UI on Idle */
    body.user-idle { cursor: none; }
    body.user-idle .controls,
    body.user-idle .top-bar {
      opacity: 0;
      pointer-events: none;
    }

    /* Dashboard Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #e2e8f0;
    }

    .modal-header {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header-btn {
      padding: 4px 8px;
      font-size: 0.85rem;
      border: 1px solid #334155;
      border-radius: 6px;
      background: transparent;
      color: #fff;
      width: auto;
    }

    .tab-nav {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #1e293b;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 6px 8px;
      cursor: pointer;
      white-space: nowrap;
      width: auto;
    }

    .tab-btn.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
      font-weight: 600;
    }

    .tab-content {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      flex: 1;
      overflow-y: auto;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .raw-logs-wrap {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
    }

    .raw-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      text-align: left;
    }

    .raw-table th, .raw-table td {
      padding: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .modal-actions button {
      padding: 8px;
      font-size: 0.8rem;
      border-width: 1px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <button class="header-btn" id="logBtn">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>Log</span>
      </button>
    </div>

    <div class="timer-display" id="display">00:00:00</div>

    <div class="controls">
      <button id="primaryBtn">
        <svg id="primaryIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span id="primaryText">Start</span>
      </button>
      <button id="secondaryBtn" style="display: none;">
        <svg id="secondaryIcon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        <span id="secondaryText">Stop</span>
      </button>
    </div>
  </div>

  <!-- Dashboard Modal -->
  <div class="modal" id="logModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Analytics Dashboard</span>
        <button id="closeModalBtn" class="modal-header-btn">✕</button>
      </div>

      <div class="tab-nav">
        <button class="tab-btn active" data-tab="rawTab">📝 Logs</button>
      </div>

      <div class="tab-content active" id="rawTab">
        <div class="raw-logs-wrap">
          <table class="raw-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>End Time</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody id="rawTableBody"></tbody>
          </table>
        </div>
        <div class="modal-actions">
          <button id="copyBtn">Copy TSV</button>
          <button id="clearBtn" style="border-color: #666; color: #aaa;">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let timerInterval = null;
    let secondsElapsed = 0;
    let isRunning = false;
    let isPaused = false;
    let wakeLock = null;
    let idleTimeout = null;
    let db = null;

    const displayEl = document.getElementById('display');
    const primaryBtn = document.getElementById('primaryBtn');
    const primaryIcon = document.getElementById('primaryIcon');
    const primaryText = document.getElementById('primaryText');
    const secondaryBtn = document.getElementById('secondaryBtn');
    const secondaryIcon = document.getElementById('secondaryIcon');
    const secondaryText = document.getElementById('secondaryText');
    const logBtn = document.getElementById('logBtn');
    const logModal = document.getElementById('logModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const icons = {
      play: '<path d="M8 5v14l11-7z"/>',
      pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
      stop: '<path d="M6 6h12v12H6z"/>',
      reset: '<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>'
    };

    function requestFullScreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
    }

    function exitFullScreen() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    async function applyLandscapeLock() {
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock('landscape');
        } catch (e) {}
      }
    }

    function unlockOrientation() {
      if (screen.orientation && screen.orientation.unlock) {
        try {
          screen.orientation.unlock();
        } catch (e) {}
      }
    }

    const dbName = "PortraitTimerDB";
    const storeName = "sessions";
    const request = indexedDB.open(dbName, 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains(storeName)) {
        db.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; };

    function saveSession(formattedDuration, seconds) {
      if (!db || seconds === 0) return;
      const tx = db.transaction([storeName], "readwrite");
      tx.objectStore(storeName).add({
        timestamp: new Date().toISOString(),
        formattedDuration,
        seconds
      });
    }

    function renderRawLogs() {
      if (!db) return;
      const tx = db.transaction([storeName], "readonly");
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => {
        const records = (req.result || []).reverse();
        const tbody = document.getElementById('rawTableBody');
        tbody.innerHTML = '';
        records.forEach(r => {
          const d = new Date(r.timestamp);
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${d.toLocaleDateString()}</td>
            <td>${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
            <td style="color:#38bdf8; font-weight:600;">${r.formattedDuration}</td>
          `;
          tbody.appendChild(tr);
        });
      };
    }

    function formatTime(totalSeconds) {
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function updateDisplay() { displayEl.textContent = formatTime(secondsElapsed); }

    function resetIdleTimer() {
      document.body.classList.remove('user-idle');
      clearTimeout(idleTimeout);
      if (isRunning && !isPaused && logModal.style.display !== 'flex') {
        idleTimeout = setTimeout(() => document.body.classList.add('user-idle'), 5000);
      }
    }

    ['mousemove', 'touchstart', 'click'].forEach(evt => window.addEventListener(evt, resetIdleTimer, { passive: true }));

    primaryBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isRunning && !isPaused) startTimer();
      else if (isRunning && !isPaused) pauseTimer();
      else if (isPaused) resumeTimer();
    });

    secondaryBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      stopTimer();
    });

    function startTimer() {
      document.body.classList.add('running-mode');
      requestFullScreen();
      applyLandscapeLock();

      isRunning = true;
      isPaused = false;
      primaryIcon.innerHTML = icons.pause;
      primaryText.textContent = 'Pause';
      secondaryIcon.innerHTML = icons.stop;
      secondaryText.textContent = 'Stop';
      secondaryBtn.style.display = 'inline-flex';
      logBtn.classList.add('hidden');

      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateDisplay();
      }, 1000);

      requestWakeLock();
      resetIdleTimer();
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      isPaused = true;
      primaryIcon.innerHTML = icons.play;
      primaryText.textContent = 'Resume';
      secondaryIcon.innerHTML = icons.reset;
      secondaryText.textContent = 'Reset';
      logBtn.classList.remove('hidden');
      saveSession(formatTime(secondsElapsed), secondsElapsed);
      releaseWakeLock();
    }

    function resumeTimer() {
      isPaused = false;
      primaryIcon.innerHTML = icons.pause;
      primaryText.textContent = 'Pause';
      secondaryIcon.innerHTML = icons.stop;
      secondaryText.textContent = 'Stop';
      logBtn.classList.add('hidden');

      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateDisplay();
      }, 1000);

      requestWakeLock();
      resetIdleTimer();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      saveSession(formatTime(secondsElapsed), secondsElapsed);
      
      document.body.classList.remove('running-mode');
      exitFullScreen();
      unlockOrientation();

      isRunning = false;
      isPaused = false;
      secondsElapsed = 0;
      primaryIcon.innerHTML = icons.play;
      primaryText.textContent = 'Start';
      secondaryBtn.style.display = 'none';
      logBtn.classList.remove('hidden');
      updateDisplay();
      releaseWakeLock();
    }

    logBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      renderRawLogs();
      logModal.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => logModal.style.display = 'none');

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
      }
    }

    async function releaseWakeLock() {
      if (wakeLock) {
        try { await wakeLock.release(); } catch (err) {}
        wakeLock = null;
      }
    }
  </script>
</body>
</html>

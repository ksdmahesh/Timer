<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Screen Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }

    /* Timer Display */
    .timer-display {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-align: center;
      transition: font-size 0.2s ease, margin 0.2s ease;
    }

    @media (orientation: landscape) {
      .timer-display {
        font-size: 32vh;
        margin-bottom: 15px;
      }

      .controls {
        gap: 20px;
      }

      .controls button {
        padding: 10px 24px;
        font-size: 1.1rem;
      }
    }

    @media (orientation: portrait) {
      .timer-display {
        font-size: 16vw;
        margin-bottom: 35px;
      }

      .controls {
        gap: 15px;
      }

      .controls button {
        padding: 14px 26px;
        font-size: 1.2rem;
      }
    }

    .controls {
      display: flex;
    }

    button {
      background: #000000;
      color: #ffffff;
      border: 2px solid #ffffff;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, opacity 0.4s ease, border-color 0.2s;
    }

    button svg {
      width: 1.1em;
      height: 1.1em;
      fill: currentColor;
      flex-shrink: 0;
    }

    button:active:not(:disabled) {
      background-color: #ffffff;
      color: #000000;
    }

    button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #555555;
      color: #888888;
    }

    /* Top Header Buttons */
    .header-btn {
      position: absolute;
      top: 15px;
      padding: 8px 16px;
      font-size: 0.85rem;
      border-width: 1px;
      transition: opacity 0.4s ease;
    }

    .log-top-btn {
      right: 15px;
    }

    .fs-btn {
      left: 15px;
    }

    /* Auto-Hide Controls */
    body.user-idle {
      cursor: none;
    }

    body.user-idle .controls,
    body.user-idle .header-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* Log Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 12px;
    }

    /* Modal Layout Container */
    .modal-content {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 580px;
      height: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #e2e8f0;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-icon-group {
      display: flex;
      gap: 6px;
    }

    .modal-header-btn {
      padding: 4px 8px;
      font-size: 0.85rem;
      border-width: 1px;
      border-radius: 6px;
      min-width: 30px;
      height: 30px;
      background: transparent;
      border-color: #334155;
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      padding: 6px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tab-btn.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
      border-radius: 0;
      font-weight: 600;
    }

    /* Tab Content Frame */
    .tab-content {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      flex: 1;
      overflow-y: auto;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* View Controls */
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .view-title {
      font-weight: 600;
      font-size: 0.85rem;
      text-align: center;
    }

    .nav-btn {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #fff;
      padding: 2px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Calendar Grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      flex: 1;
    }

    .cal-day-label {
      font-size: 0.7rem;
      color: #94a3b8;
      padding-bottom: 2px;
      font-weight: bold;
    }

    .cal-cell {
      height: 32px;
      border-radius: 4px;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #64748b;
    }

    .cal-cell.empty {
      background: transparent;
    }

    .cal-cell.level-1 {
      background-color: #064e3b;
      color: #a7f3d0;
    }

    .cal-cell.level-2 {
      background-color: #047857;
      color: #ffffff;
    }

    .cal-cell.level-3 {
      background-color: #10b981;
      color: #ffffff;
      font-weight: bold;
    }

    .cal-cell.level-4 {
      background-color: #34d399;
      color: #000000;
      font-weight: bold;
    }

    .cal-legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .legend-box {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    /* Weekly Chart */
    .chart-container {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      flex: 1;
      padding-top: 10px;
      border-bottom: 1px solid #334155;
      margin-bottom: 4px;
    }

    .chart-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      width: 12%;
    }

    .chart-bar-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .chart-val {
      font-size: 0.65rem;
      color: #38bdf8;
      margin-bottom: 2px;
    }

    .chart-bar {
      width: 100%;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      transition: height 0.3s ease;
    }

    .chart-label {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    /* Total Progress Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      margin-top: 2px;
    }

    .stat-lbl {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    /* Raw Logs Tabular Styling */
    .raw-logs-wrap {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
    }

    .raw-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      text-align: left;
    }

    .raw-table:has(tbody #no-records) {
      height: 100%;
    }

    .raw-table th,
    .raw-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
    }

    .raw-table th {
      background: #090d16;
      color: #38bdf8;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .raw-table tbody tr:hover {
      background: #1e293b;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .modal-actions button {
      padding: 6px 14px;
      font-size: 0.8rem;
      border-width: 1px;
      border-radius: 16px;
      flex: 1;
    }
  </style>
</head>

<body>

  <!-- Top Action Buttons -->
  <button class="header-btn log-top-btn" id="logBtn">
    <svg viewBox="0 0 24 24">
      <path
        d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
    </svg>
    <span>Log</span>
  </button>

  <div class="timer-display" id="display">00:00:00</div>

  <!-- Dynamic Control Buttons -->
  <div class="controls">
    <button id="primaryBtn">
      <svg id="primaryIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
      <span id="primaryText">Start</span>
    </button>
    <button id="secondaryBtn" style="display: none;">
      <svg id="secondaryIcon" viewBox="0 0 24 24">
        <path d="M6 6h12v12H6z" />
      </svg>
      <span id="secondaryText">Stop</span>
    </button>
  </div>

  <!-- Dashboard Modal -->
  <div class="modal" id="logModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="header-icon-group">
          <button id="downloadBtn" class="modal-header-btn" title="Download Log JSON">
            <svg viewBox="0 0 24 24">
              <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
            </svg>
          </button>
          <button id="importBtn" class="modal-header-btn" title="Import Log JSON">
            <svg viewBox="0 0 24 24">
              <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
            </svg>
          </button>
          <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </div>

        <span>Analytics Dashboard</span>
        <button id="closeModalBtn" class="modal-header-btn" title="Close">✕</button>
      </div>

      <!-- Tab Bar -->
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="calTab">📅 Calendar View</button>
        <button class="tab-btn" data-tab="chartTab">📊 Weekly Chart</button>
        <button class="tab-btn" data-tab="progressTab">⭕ Total Progress</button>
        <button class="tab-btn" data-tab="rawTab">📝 Raw Logs</button>
      </div>

      <!-- Tab 1: Calendar View -->
      <div class="tab-content active" id="calTab">
        <div class="view-header">
          <button class="nav-btn" id="prevMonthBtn">‹</button>
          <div class="view-title" id="calMonthTitle">Calendar Heatmap</div>
          <button class="nav-btn" id="nextMonthBtn">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span>Less</span>
          <div class="legend-box" style="background: #0f172a"></div>
          <div class="legend-box" style="background: #064e3b"></div>
          <div class="legend-box" style="background: #047857"></div>
          <div class="legend-box" style="background: #10b981"></div>
          <div class="legend-box" style="background: #34d399"></div>
          <span>More</span>
        </div>
      </div>

      <!-- Tab 2: Weekly Chart -->
      <div class="tab-content" id="chartTab">
        <div class="view-header">
          <button class="nav-btn" id="prevWeekBtn">‹</button>
          <div class="view-title" id="chartWeekTitle">Time Spent</div>
          <button class="nav-btn" id="nextWeekBtn">›</button>
        </div>
        <div class="chart-container" id="weeklyChart"></div>
      </div>

      <!-- Tab 3: Total Progress -->
      <div class="tab-content" id="progressTab">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size:0.85rem; font-weight:600;">Detailed Analytics Overview</div>
          <div class="stats-grid" id="statsSummary"></div>
        </div>
      </div>

      <!-- Tab 4: Raw Logs (Tabular View) -->
      <div class="tab-content" id="rawTab">
        <div class="raw-logs-wrap">
          <table class="raw-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody id="rawTableBody">
            </tbody>
          </table>
        </div>
        <div class="modal-actions">
          <button id="copyBtn">
            <svg viewBox="0 0 24 24">
              <path
                d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
            </svg>
            <span>Copy</span>
          </button>
          <button id="clearBtn" style="border-color: #666; color: #aaa;">
            <svg viewBox="0 0 24 24">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let timerInterval = null;
    let secondsElapsed = 0;
    let isRunning = false;
    let isPaused = false;
    let wakeLock = null;
    let idleTimeout = null;
    let db = null;
    let currentSessionId = null;
    let sessionStartTimestamp = null;

    let viewDate = new Date();
    let chartWeekOffset = 0;

    const displayEl = document.getElementById('display');
    const primaryBtn = document.getElementById('primaryBtn');
    const primaryIcon = document.getElementById('primaryIcon');
    const primaryText = document.getElementById('primaryText');

    const secondaryBtn = document.getElementById('secondaryBtn');
    const secondaryIcon = document.getElementById('secondaryIcon');
    const secondaryText = document.getElementById('secondaryText');

    const logBtn = document.getElementById('logBtn');
    const fsBtn = document.getElementById('fsBtn');
    const fsIcon = document.getElementById('fsIcon');
    const fsText = document.getElementById('fsText');

    const logModal = document.getElementById('logModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');
    const clearBtn = document.getElementById('clearBtn');

    const icons = {
      start: '<path d="M8 5v14l11-7z"/>',
      pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
      stop: '<path d="M6 6h12v12H6z"/>',
      reset: '<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>',
      expand: '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>',
      compress: '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>'
    };

    // DB Setup
    const dbName = "TimerDatabase";
    const storeName = "timer_sessions";

    const request = indexedDB.open(dbName, 1);

    request.onupgradeneeded = function (e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains(storeName)) {
        const objectStore = db.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
        objectStore.createIndex("timestamp", "timestamp", { unique: false });
      }
    };

    request.onsuccess = function (e) {
      db = e.target.result;
    };

    function saveOrUpdateSessionToDB(formattedDuration, seconds) {
      if (!db || seconds === 0) return;

      const transaction = db.transaction([storeName], "readwrite");
      const objectStore = transaction.objectStore(storeName);
      const isoEndTimestamp = new Date().toISOString();
      const isoStartTimestamp = sessionStartTimestamp || isoEndTimestamp;

      if (currentSessionId === null) {
        const record = {
          timestamp: isoEndTimestamp,
          startTime: isoStartTimestamp,
          endTime: isoEndTimestamp,
          formattedDuration,
          seconds
        };
        const addRequest = objectStore.add(record);
        addRequest.onsuccess = function (e) { currentSessionId = e.target.result; };
      } else {
        const record = {
          id: currentSessionId,
          timestamp: isoEndTimestamp,
          startTime: isoStartTimestamp,
          endTime: isoEndTimestamp,
          formattedDuration,
          seconds
        };
        objectStore.put(record);
      }
    }

    function getAllRecords(callback) {
      if (!db) return callback([]);
      const tx = db.transaction([storeName], "readonly");
      const store = tx.objectStore(storeName);
      const req = store.getAll();
      req.onsuccess = () => callback(req.result || []);
    }

    function renderDashboard() {
      getAllRecords(records => {
        renderCalendar(records);
        renderWeeklyChart(records);
        renderTotalProgress(records);
        renderRawLogs(records);
      });
    }

    function renderCalendar(records) {
      const calGrid = document.getElementById('calGrid');
      const calTitle = document.getElementById('calMonthTitle');
      calGrid.innerHTML = '';

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      calTitle.textContent = `${monthNames[month]} ${year}`;

      const dailyTotals = {};
      records.forEach(r => {
        const d = new Date(r.timestamp);
        if (!isNaN(d.getTime())) {
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          dailyTotals[key] = (dailyTotals[key] || 0) + (r.seconds || 0);
        }
      });

      ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(day => {
        const lbl = document.createElement('div');
        lbl.className = 'cal-day-label';
        lbl.textContent = day;
        calGrid.appendChild(lbl);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-cell empty';
        calGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const totalSecs = dailyTotals[key] || 0;

        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = day;

        if (totalSecs > 0) {
          const mins = totalSecs / 60;
          if (mins < 5) cell.classList.add('level-1');
          else if (mins < 30) cell.classList.add('level-2');
          else if (mins < 120) cell.classList.add('level-3');
          else cell.classList.add('level-4');

          cell.title = `${key}: ${formatTime(totalSecs)}`;
        }

        calGrid.appendChild(cell);
      }
    }

    function renderWeeklyChart(records) {
      const chartEl = document.getElementById('weeklyChart');
      const titleEl = document.getElementById('chartWeekTitle');
      chartEl.innerHTML = '';

      const curr = new Date();
      curr.setDate(curr.getDate() + (chartWeekOffset * 7));
      const startOfWeek = new Date(curr.setDate(curr.getDate() - curr.getDay()));
      startOfWeek.setHours(0, 0, 0, 0);

      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(endOfWeek.getDate() + 6);
      endOfWeek.setHours(23, 59, 59, 999);

      const dayTotals = [0, 0, 0, 0, 0, 0, 0];
      records.forEach(r => {
        const d = new Date(r.timestamp);
        if (!isNaN(d.getTime()) && d >= startOfWeek && d <= endOfWeek) {
          dayTotals[d.getDay()] += (r.seconds || 0);
        }
      });

      const maxSecs = Math.max(...dayTotals, 0);

      let unitMode = 'seconds';
      if (maxSecs >= 3600) unitMode = 'hours';
      else if (maxSecs >= 60) unitMode = 'minutes';

      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const dateRangeStr = `${monthNames[startOfWeek.getMonth()]} ${startOfWeek.getDate()} - ${monthNames[endOfWeek.getMonth()]} ${endOfWeek.getDate()}`;
      titleEl.textContent = `Time Spent in ${unitMode.charAt(0).toUpperCase() + unitMode.slice(1)} (${dateRangeStr})`;

      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const scaleBaseline = maxSecs > 0 ? maxSecs : 1;

      dayNames.forEach((name, idx) => {
        const secs = dayTotals[idx];
        let displayVal = '';

        if (secs > 0) {
          if (unitMode === 'hours') displayVal = (secs / 3600).toFixed(1) + 'h';
          else if (unitMode === 'minutes') displayVal = (secs / 60).toFixed(1) + 'm';
          else displayVal = secs + 's';
        }

        const pct = secs > 0 ? Math.max((secs / scaleBaseline) * 100, 6) : 0;

        const col = document.createElement('div');
        col.className = 'chart-col';
        col.innerHTML = `
          <div class="chart-bar-wrap">
            <span class="chart-val">${displayVal}</span>
            <div class="chart-bar" style="height: ${pct}%"></div>
          </div>
          <span class="chart-label">${name}</span>
        `;
        chartEl.appendChild(col);
      });
    }

    function renderTotalProgress(records) {
      const summaryEl = document.getElementById('statsSummary');
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();

      const dailyTotals = {};
      let totalSecs = 0;
      let thisMonthSecs = 0;
      let thisYearSecs = 0;

      records.forEach(r => {
        const secs = r.seconds || 0;
        totalSecs += secs;

        const d = new Date(r.timestamp);
        if (!isNaN(d.getTime())) {
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          dailyTotals[key] = (dailyTotals[key] || 0) + secs;

          if (d.getFullYear() === currentYear) {
            thisYearSecs += secs;
            if (d.getMonth() === currentMonth) {
              thisMonthSecs += secs;
            }
          }
        }
      });

      const sessionCount = records.length;
      const avgSecs = sessionCount > 0 ? Math.round(totalSecs / sessionCount) : 0;

      // Single Day Maximum
      const maxDaySecs = Math.max(...Object.values(dailyTotals), 0);

      // Streaks & Active/Missed Days
      const dates = Object.keys(dailyTotals).sort();
      let currentStreak = 0;
      let highestStreak = 0;
      let missedDays = 0;

      if (dates.length > 0) {
        // High streak calculation
        let tempStreak = 0;
        let prevDate = null;

        dates.forEach(dStr => {
          const d = new Date(dStr);
          if (prevDate) {
            const diffDays = Math.round((d - prevDate) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) {
              tempStreak++;
            } else {
              tempStreak = 1;
            }
          } else {
            tempStreak = 1;
          }
          if (tempStreak > highestStreak) highestStreak = tempStreak;
          prevDate = d;
        });

        // Current streak calculation
        let checkDate = new Date();
        checkDate.setHours(0, 0, 0, 0);

        let checkKey = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
        if (!dailyTotals[checkKey]) {
          checkDate.setDate(checkDate.getDate() - 1);
          checkKey = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
        }

        while (dailyTotals[checkKey]) {
          currentStreak++;
          checkDate.setDate(checkDate.getDate() - 1);
          checkKey = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
        }

        // Missed Days Calculation
        const firstDate = new Date(dates[0]);
        const todayDate = new Date();
        firstDate.setHours(0, 0, 0, 0);
        todayDate.setHours(0, 0, 0, 0);

        const totalTimespanDays = Math.floor((todayDate - firstDate) / (1000 * 60 * 60 * 24)) + 1;
        const activeDaysCount = dates.length;
        missedDays = Math.max(0, totalTimespanDays - activeDaysCount);
      }

      summaryEl.innerHTML = `
        <!-- Row 1: Current, Highest Streak, Missed Days -->
        <div class="stat-card">
          <div class="stat-lbl">Current Streak</div>
          <div class="stat-val">${currentStreak} 🔥</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Highest Streak</div>
          <div class="stat-val">${highestStreak} ⚡</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Missed Days</div>
          <div class="stat-val">${missedDays}</div>
        </div>

        <!-- Row 2: Single Day, This Month, This Year -->
        <div class="stat-card">
          <div class="stat-lbl">Max Single Day</div>
          <div class="stat-val">${formatTime(maxDaySecs)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">This Month</div>
          <div class="stat-val">${(thisMonthSecs / 3600).toFixed(1)}h</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">This Year</div>
          <div class="stat-val">${(thisYearSecs / 3600).toFixed(1)}h</div>
        </div>

        <!-- Row 3: Total Hours, Avg Session, Total Sessions -->
        <div class="stat-card">
          <div class="stat-lbl">Total Hours</div>
          <div class="stat-val">${(totalSecs / 3600).toFixed(1)}h</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Avg Session</div>
          <div class="stat-val">${formatTime(avgSecs)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Total Sessions</div>
          <div class="stat-val">${sessionCount}</div>
        </div>
      `;
    }

    function renderRawLogs(records) {
      const tbody = document.getElementById('rawTableBody');
      tbody.innerHTML = '';

      if (records.length === 0) {
        tbody.innerHTML = `<tr id="no-records"><td colspan="4" style="text-align:center; color:#64748b; padding: 20px;">No records found.</td></tr>`;
        return;
      }

      // Display most recent records on top
      const sortedRecords = [...records].reverse();

      sortedRecords.forEach(item => {
        const endDate = new Date(item.endTime || item.timestamp);
        const startDate = item.startTime ? new Date(item.startTime) : new Date(endDate.getTime() - ((item.seconds || 0) * 1000));

        const dateStr = !isNaN(endDate.getTime()) ? endDate.toLocaleDateString() : 'N/A';
        const startTimeStr = !isNaN(startDate.getTime()) ? startDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'N/A';
        const endTimeStr = !isNaN(endDate.getTime()) ? endDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'N/A';
        const durationStr = item.formattedDuration || formatTime(item.seconds || 0);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${dateStr}</td>
          <td>${startTimeStr}</td>
          <td>${endTimeStr}</td>
          <td style="color:#38bdf8; font-weight:600;">${durationStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Calendar Navigation
    document.getElementById('prevMonthBtn').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      getAllRecords(renderCalendar);
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      getAllRecords(renderCalendar);
    });

    // Chart Week Navigation
    document.getElementById('prevWeekBtn').addEventListener('click', () => {
      chartWeekOffset--;
      getAllRecords(renderWeeklyChart);
    });

    document.getElementById('nextWeekBtn').addEventListener('click', () => {
      chartWeekOffset++;
      getAllRecords(renderWeeklyChart);
    });

    // Tab Navigation
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // Timer Implementation
    function formatTime(totalSeconds) {
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function updateDisplay() {
      displayEl.textContent = formatTime(secondsElapsed);
    }

    function resetIdleTimer() {
      document.body.classList.remove('user-idle');
      clearTimeout(idleTimeout);

      if (isRunning && !isPaused && logModal.style.display !== 'flex') {
        idleTimeout = setTimeout(() => {
          if (isRunning && !isPaused) {
            document.body.classList.add('user-idle');
          }
        }, 5000);
      }
    }

    ['mousemove', 'mousedown', 'touchstart', 'keydown', 'click'].forEach(evt => {
      window.addEventListener(evt, resetIdleTimer, { passive: true });
    });

    primaryBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!isRunning && !isPaused) startTimer();
      else if (isRunning && !isPaused) pauseTimer();
      else if (isPaused) resumeTimer();
    });

    secondaryBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      stopTimer();
    });

    function startTimer() {
      isRunning = true;
      isPaused = false;
      sessionStartTimestamp = new Date().toISOString();
      primaryIcon.innerHTML = icons.pause;
      primaryText.textContent = 'Pause';
      secondaryIcon.innerHTML = icons.stop;
      secondaryText.textContent = 'Stop';
      secondaryBtn.style.display = 'inline-flex';
      logBtn.disabled = true;
      logBtn.style.display = 'none';

      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateDisplay();
      }, 1000);

      requestWakeLock();
      resetIdleTimer();
    }

    function pauseTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      isPaused = true;
      document.body.classList.remove('user-idle');
      clearTimeout(idleTimeout);

      primaryIcon.innerHTML = icons.start;
      primaryText.textContent = 'Resume';
      secondaryIcon.innerHTML = icons.reset;
      secondaryText.textContent = 'Reset';

      logBtn.disabled = true;
      logBtn.style.display = 'none';

      saveOrUpdateSessionToDB(formatTime(secondsElapsed), secondsElapsed);
      releaseWakeLock();
    }

    function resumeTimer() {
      isPaused = false;
      primaryIcon.innerHTML = icons.pause;
      primaryText.textContent = 'Pause';
      secondaryIcon.innerHTML = icons.stop;
      secondaryText.textContent = 'Stop';

      logBtn.disabled = true;
      logBtn.style.display = 'none';

      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateDisplay();
      }, 1000);

      requestWakeLock();
      resetIdleTimer();
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      saveOrUpdateSessionToDB(formatTime(secondsElapsed), secondsElapsed);

      isRunning = false;
      isPaused = false;
      secondsElapsed = 0;
      currentSessionId = null;
      sessionStartTimestamp = null;

      document.body.classList.remove('user-idle');
      clearTimeout(idleTimeout);

      primaryIcon.innerHTML = icons.start;
      primaryText.textContent = 'Start';
      secondaryBtn.style.display = 'none';

      logBtn.disabled = false;
      logBtn.style.display = 'inline-flex';

      updateDisplay();
      releaseWakeLock(true);
    }

    // Modal Actions
    logBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (logBtn.disabled) return;
      renderDashboard();
      logModal.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => {
      logModal.style.display = 'none';
      resetIdleTimer();
    });

    copyBtn.addEventListener('click', () => {
      getAllRecords(records => {
        if (records.length === 0) return alert('No records to copy.');
        let tsv = "Date\tStart Time\tEnd Time\tDuration\n";
        [...records].reverse().forEach(item => {
          const endDate = new Date(item.endTime || item.timestamp);
          const startDate = item.startTime ? new Date(item.startTime) : new Date(endDate.getTime() - ((item.seconds || 0) * 1000));

          const dateStr = !isNaN(endDate.getTime()) ? endDate.toLocaleDateString() : 'N/A';
          const startTimeStr = !isNaN(startDate.getTime()) ? startDate.toLocaleTimeString() : 'N/A';
          const endTimeStr = !isNaN(endDate.getTime()) ? endDate.toLocaleTimeString() : 'N/A';
          const durationStr = item.formattedDuration || formatTime(item.seconds || 0);

          tsv += `${dateStr}\t${startTimeStr}\t${endTimeStr}\t${durationStr}\n`;
        });
        navigator.clipboard.writeText(tsv).then(() => {
          alert('Table logs copied as TSV to clipboard!');
        });
      });
    });

    downloadBtn.addEventListener('click', () => {
      getAllRecords(records => {
        const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'indexeddb_timer_backup.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      });
    });

    importBtn.addEventListener('click', () => importFileInput.click());

    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        try {
          const records = JSON.parse(event.target.result);
          if (Array.isArray(records)) {
            const tx = db.transaction([storeName], "readwrite");
            const store = tx.objectStore(storeName);
            records.forEach(r => { delete r.id; store.add(r); });
            tx.oncomplete = () => {
              alert('Successfully imported records!');
              renderDashboard();
            };
          }
        } catch (err) { alert('Error parsing JSON file.'); }
      };
      reader.readAsText(file);
      importFileInput.value = '';
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Delete all entries in IndexedDB?')) {
        if (!db) return;
        const tx = db.transaction([storeName], "readwrite");
        tx.objectStore(storeName).clear().onsuccess = () => renderDashboard();
      }
    });

    async function requestWakeLock() {
      await document.documentElement.requestFullscreen().catch(() => { });
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape').catch(err => console.log(err));
      }
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) { }
      }
    }

    async function releaseWakeLock(exitFullscreen = false) {
      if (exitFullscreen) {
        await document.exitFullscreen().catch(() => { });
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      }
      if (wakeLock) {
        try { await wakeLock.release(); } catch (err) { }
        wakeLock = null;
      }
    }

    fsBtn.addEventListener('click', async function (e) {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen().catch(() => { });
        fsIcon.innerHTML = icons.compress;
        fsText.textContent = 'Exit Full Screen';
      } else {
        await document.exitFullscreen().catch(() => { });
        fsIcon.innerHTML = icons.expand;
        fsText.textContent = 'Full Screen';
      }
    });
  </script>
</body>

</html>
